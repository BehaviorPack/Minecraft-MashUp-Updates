name: Monitor Minecraft Marketplace Packs

on:
  schedule:
    # Every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # manual trigger
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: pack-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scan all packs (manifest-only, one commit per pack)
        env:
          TITLE_ID: ${{ secrets.TITLE_ID }}
          TITLE_SHARED_SECRET: ${{ secrets.TITLE_SHARED_SECRET }}
          PLAYER_SECRET: ${{ secrets.PLAYER_SECRET }}
          CUSTOM_ID: ${{ secrets.CUSTOM_ID }}
        working-directory: src
        run: python scan_pack.py --all

      - name: Rebuild README from state.json
        working-directory: src
        run: python update_readme.py

      - name: Commit README if it changed
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged."
          else
            git commit -m "chore(readme): refresh pack table [skip ci]"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Pack monitor run" >> $GITHUB_STEP_SUMMARY
          if [ -f data/state.json ]; then
            count=$(python -c "import json;print(len(json.load(open('data/state.json'))))")
            echo "- Tracked packs: **$count**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Manifests: \`data/manifests/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Changes:   \`data/changes/\`" >> $GITHUB_STEP_SUMMARY
